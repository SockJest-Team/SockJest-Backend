# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - LiveBidApi

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        working-directory: backend        
        run: |
          npm install
          npm run build --if-present
          # (test se quitó: los specs por defecto de Nest fallan en CI sin BD)

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend                  

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'LiveBidApi'
          slot-name: 'Production'
          package: .                      
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_EE2BE9A15B4E4E38AF264159520E2A14 }}
